# configs/phase0_config.yaml

# Data sources configuration
data_sources:
  primary: "GEE"  # "GEE" or "CDSE"
  fallback: "CDSE"  # "GEE" or "CDSE"
  env_file: "/Users/yasir/Desktop/Data/.env"
  gee_project: "urbanease-cfcf0"

# General pipeline settings
settings:
  target_resolution: 10.0  # meters
  output_crs_strategy: "auto_utm"  # "auto_utm" or a specific EPSG code like 32644
  cloud_threshold: 20.0  # max cloud percentage for Sentinel-2
  valid_pixel_threshold: 80.0  # min valid pixel percentage for QA

# Sentinel-1 SAR selection rules
sentinel1_rules:
  polarizations: ["VV", "VH"]
  instrument_mode: "IW"
  processing_level: "GRD"
  temporal_search_window_days: 30  # Search up to 30 days before/after event impact

# Sentinel-2 Optical selection rules
sentinel2_rules:
  bands: ["B2", "B3", "B4", "B8"]
  processing_level: "L2A"
  temporal_search_window_days: 45  # Search up to 45 days before/after event impact

# Event configurations - coordinates, dates, and offsets to avoid hardcoding
