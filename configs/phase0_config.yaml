    name: "Chennai Floods 2015"
    disaster_type: "floods"
    impact_date: "2015-12-01"
    lat: 13.0827
    lon: 80.2707
    aoi_size_deg: 0.15
    s1_pre_window: ["2015-10-01", "2015-11-05"]
    s1_post_window: ["2015-12-03", "2015-12-25"]
    s2_pre_window: ["2015-10-01", "2015-11-05"]
