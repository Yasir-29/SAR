settings:
  # Minimum ratio of building intersection area relative to original building area to keep it
  # (used if centroid lies outside AOI).
  aoi_intersection_threshold: 0.50
  
  # Minimum and maximum building footprints area in square meters to filter out noise or flag
  minimum_building_area_m2: 5.0
  maximum_suspicious_building_area_m2: 5000.0
  
  # Intersection-over-Union (IoU) threshold to flag overlapping duplicate polygons
  duplicate_overlap_threshold: 0.90
  
  # CRS Strategy for projected coordinates analysis
  crs_strategy: "local_utm"
  
  # Default footprint source priority list
  source_preferences:
    - "google_open_buildings"
    - "osm"
    
  # Export settings
  output_format: "geopackage"
  export_wgs84: true
  export_geojson: false
